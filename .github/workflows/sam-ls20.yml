name: SAM ls20 solver

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "sam/**"
      - "scripts/**"
      - "tests/**"
      - "environment_files/**"

jobs:
  solve-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest tests/ -q --ignore=tests/test_sam_ls20_m1.py

      - name: BFS solve ls20 (long-running)
        run: python scripts/solve_ls20.py --all --time-limit 900 --max-steps 200

      - name: Run SAM on ls20
        run: python scripts/run_sam.py --game ls20-9607627b --env-dir environment_files

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sam-ls20-results
          path: |
            sam/checkpoints/ls20_plans.json
            sam/runs/ls20-9607627b_summary.json
            sam/runs/ls20-9607627b.jsonl
